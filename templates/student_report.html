{% extends 'base.html' %}
{% block content %}
<form action="/" method="GET" style="position: absolute; top: 20px; left: 20px;">
    <button type="submit" style="
        padding: 8px 16px;
        background-color: #6a1b9a;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    ">
        🔙 Back to Home
    </button>
</form>
<h2>📋 Attendance for {{ student.name }} (Roll No: {{ student.roll_no }})</h2>

<table border="1" cellpadding="8" cellspacing="0" style="margin-top: 20px;">
    <thead>
        <tr>
            <th>Subject</th>
            <th>Date</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for r in records %}
        <tr>
            <td>{{ r.subject }}</td>
            <td>{{ r.date }}</td>
            <td class="{% if r.status == 'Present' %}status-present{% else %}status-absent{% endif %}">
                {{ r.status }}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
