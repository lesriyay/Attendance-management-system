{% extends 'base.html' %}
{% block content %}
<form action="/" method="GET" style="position: absolute; top: 20px; left: 20px;">
    <button type="submit" style="
        padding: 8px 16px;
        background-color: #6a1b9a;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    ">
        🔙 Back to Home
    </button>
</form>
<h2>🎓 View Your Attendance</h2>
<form method="POST" style="margin-top: 20px;">
    <label for="roll_no">Enter Roll Number:</label>
    <input type="text" name="roll_no" required>
    <button type="submit">View Report</button>
</form>
{% endblock %}
