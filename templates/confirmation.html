{% extends 'base.html' %}
{% block content %}

<form action="/" method="GET" style="position: absolute; top: 20px; left: 20px;">
    <button type="submit" style="
        padding: 8px 16px;
        background-color: #6a1b9a;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    ">
        🔙 Back to Home
    </button>
</form>
<h2 style="color:rgb(209, 92, 217);">{{ message }}</h2>

<!-- Optional: Auto-close tab after 3 seconds -->
<script>
    setTimeout(() => {
        window.close();
    }, 3000);
</script>

<!-- Manual fallback -->
<p>If this tab doesn't close automatically, you can close it manually.</p>
{% endblock %}
