{% extends 'base.html' %}
{% block content %}
<h2>✏️ Edit Teacher</h2>
<form method="POST">
    <label>Name:</label>
    <input type="text" name="name" value="{{ teacher.name }}" required><br><br>
    <label>Email:</label>
    <input type="email" name="email" value="{{ teacher.email }}" required><br><br>
    <label>Subject:</label>
    <input type="text" name="subject" value="{{ teacher.subject }}" required><br><br>
    <button type="submit">💾 Save Changes</button>
</form>
{% endblock %}
